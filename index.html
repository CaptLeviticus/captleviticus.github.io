        linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);

    .btn-interactive {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ========================================================================

    // ========================================================================
    // INTERACTIVE SAMPLE 1: SPREADSHEET AUTOMATION SIMULATOR
    // ========================================================================
    function SpreadsheetSampleModal() {
      const [targetAht, setTargetAht] = useState(65);
      const [minQaSla, setMinQaSla] = useState(96);
      const [rows, setRows] = useState([
        { id: "BATCH-101", modality: "Video Action Segmentation", tasks: 85, minutes: 82, errors: 1 },
        { id: "BATCH-102", modality: "LLM Grounding & Ranking", tasks: 64, minutes: 68, errors: 0 },
        { id: "BATCH-103", modality: "Taxonomy Metadata Tagging", tasks: 110, minutes: 95, errors: 2 },
        { id: "BATCH-104", modality: "Multimodal Audio/Text QA", tasks: 72, minutes: 84, errors: 4 }
      ]);
      const [activeFormula, setActiveFormula] = useState(
        '=ARRAYFORMULA(IF(C2:C5>0, ROUND((D2:D5*60)/C2:C5, 1), 0))'
      );

      const updateRow = (index, field, value) => {
        const num = Math.max(0, Number(value) || 0);
        setRows(prev => prev.map((r, i) => (i === index ? { ...r, [field]: num } : r)));
      };

      const addSampleRow = () => {
        const nextNum = 101 + rows.length;
        setRows(prev => [
          ...prev,
          {
            id: `BATCH-${nextNum}`,
            modality: "Peer QA Validation Audit",
            tasks: 90,
            minutes: 85,
            errors: 1
          }
        ]);
      };

      const computed = useMemo(() => {
        return rows.map(r => {
          const ahtSec = r.tasks > 0 ? Number(((r.minutes * 60) / r.tasks).toFixed(1)) : 0;
          const qaScore = r.tasks > 0 ? Number(Math.max(0, ((r.tasks - r.errors) / r.tasks) * 100).toFixed(1)) : 100;
          const ahtPass = ahtSec <= targetAht;
          const qaPass = qaScore >= minQaSla;
          const status = ahtPass && qaPass ? "SLA OPTIMAL" : qaPass ? "AHT REVIEW" : "QA AUDIT REQ";
          return { ...r, ahtSec, qaScore, ahtPass, qaPass, status };
        });
      }, [rows, targetAht, minQaSla]);

      const totals = useMemo(() => {
        const totalTasks = computed.reduce((s, r) => s + r.tasks, 0);
        const totalMin = computed.reduce((s, r) => s + r.minutes, 0);
        const totalErr = computed.reduce((s, r) => s + r.errors, 0);
        const avgAht = totalTasks > 0 ? ((totalMin * 60) / totalTasks).toFixed(1) : "0.0";
        const avgQa = totalTasks > 0 ? (((totalTasks - totalErr) / totalTasks) * 100).toFixed(1) : "100.0";
        const passCount = computed.filter(r => r.status === "SLA OPTIMAL").length;
        return { totalTasks, totalMin, avgAht, avgQa, passCount };
      }, [computed]);

      const exportCsv = () => {
        const headers = ["Batch ID,Modality,Tasks Completed,Duration (Min),Calculated AHT (Sec),QA Errors,QA Score (%),Automated SLA Status"];
        const csvRows = computed.map(
          r => `${r.id},"${r.modality}",${r.tasks},${r.minutes},${r.ahtSec},${r.errors},${r.qaScore}%,${r.status}`
        );
        const blob = new Blob([[...headers, ...csvRows].join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Automated_AHT_QA_Report_Levie_Lameyra.csv";
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="space-y-5">
          {/* Top Formula Bar */}
          <div className="flex flex-wrap items-center gap-2 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-xs font-mono">
            <span className="px-2 py-0.5 rounded bg-emerald-600 text-white font-semibold">fx</span>
            <span className="text-slate-600 dark:text-slate-300 break-all">{activeFormula}</span>
          </div>

          {/* Interactive SLA Controls */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-900/60 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
            <div>
              <div className="flex justify-between text-xs font-semibold mb-1.5">
                <span className="text-slate-600 dark:text-slate-300">Target Max AHT Threshold (Seconds / Task)</span>
                <span className="font-mono text-blue-600 dark:text-blue-400">{targetAht}s</span>
              </div>
              <input
                type="range"
                min="40"
                max="100"
                value={targetAht}
                onChange={e => setTargetAht(Number(e.target.value))}
                className="w-full accent-blue-600 cursor-pointer"
              />
            </div>
            <div>
              <div className="flex justify-between text-xs font-semibold mb-1.5">
                <span className="text-slate-600 dark:text-slate-300">Minimum ISO QA Rubric Accuracy SLA (%)</span>
                <span className="font-mono text-emerald-600 dark:text-emerald-400">{minQaSla}%</span>
              </div>
              <input
                type="range"
                min="90"
                max="100"
                step="0.5"
                value={minQaSla}
                onChange={e => setMinQaSla(Number(e.target.value))}
                className="w-full accent-emerald-600 cursor-pointer"
              />
            </div>
          </div>

          {/* KPI Summary Strip */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <p className="text-xs text-slate-500">Total Tasks Logged</p>
              <p className="text-xl font-bold font-mono mt-0.5">{totals.totalTasks}</p>
            </div>
            <div className="p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <p className="text-xs text-slate-500">Weighted Avg AHT</p>
              <p className="text-xl font-bold font-mono text-blue-600 dark:text-blue-400 mt-0.5">{totals.avgAht}s</p>
            </div>
            <div className="p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <p className="text-xs text-slate-500">Net QA Accuracy</p>
              <p className="text-xl font-bold font-mono text-emerald-600 dark:text-emerald-400 mt-0.5">{totals.avgQa}%</p>
            </div>
            <div className="p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <p className="text-xs text-slate-500">Batches Meeting SLA</p>
              <p className="text-xl font-bold font-mono mt-0.5">{totals.passCount} / {computed.length}</p>
            </div>
          </div>

          {/* Interactive Spreadsheet Table */}
          <div className="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800">
            <table className="w-full text-left border-collapse text-xs sm:text-sm">
              <thead>
                <tr className="bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-800 font-mono text-xs">
                  <th className="py-2.5 px-3">A: Batch ID</th>
                  <th className="py-2.5 px-3">B: Workflow Modality</th>
                  <th className="py-2.5 px-3">C: Tasks (Edit)</th>
                  <th className="py-2.5 px-3">D: Mins (Edit)</th>
                  <th className="py-2.5 px-3">E: Errors (Edit)</th>
                  <th className="py-2.5 px-3">F: Auto AHT</th>
                  <th className="py-2.5 px-3">G: QA Score</th>
                  <th className="py-2.5 px-3">H: Auto SLA Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200 dark:divide-slate-800 bg-white dark:bg-slate-950">
                {computed.map((row, idx) => (
                  <tr
                    key={row.id}
                    onClick={() =>
                      setActiveFormula(
                        `=IF(AND(F${idx + 2}<=${targetAht}, G${idx + 2}>=${minQaSla}%), "SLA OPTIMAL", IF(G${idx + 2}<${minQaSla}%, "QA AUDIT REQ", "AHT REVIEW"))`
                      )
                    }
                    className="hover:bg-blue-50/50 dark:hover:bg-slate-900/60 transition cursor-pointer"
                  >
                    <td className="py-2.5 px-3 font-mono font-semibold text-xs">{row.id}</td>
                    <td className="py-2.5 px-3 font-medium">{row.modality}</td>
                    <td className="py-2 px-3">
                      <input
                        type="number"
                        value={row.tasks}
                        onChange={e => updateRow(idx, "tasks", e.target.value)}
                        className="w-16 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-xs"
                      />
                    </td>
                    <td className="py-2 px-3">
                      <input
                        type="number"
                        value={row.minutes}
                        onChange={e => updateRow(idx, "minutes", e.target.value)}
                        className="w-16 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-xs"
                      />
                    </td>
                    <td className="py-2 px-3">
                      <input
                        type="number"
                        value={row.errors}
                        onChange={e => updateRow(idx, "errors", e.target.value)}
                        className="w-14 px-2 py-1 rounded border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-xs"
                      />
                    </td>
                    <td className={`py-2.5 px-3 font-mono font-semibold ${row.ahtPass ? "text-slate-800 dark:text-slate-200" : "text-amber-600 dark:text-amber-400"}`}>
                      {row.ahtSec}s
                    </td>
                    <td className={`py-2.5 px-3 font-mono font-semibold ${row.qaPass ? "text-emerald-600 dark:text-emerald-400" : "text-rose-600 dark:text-rose-400"}`}>
                      {row.qaScore}%
                    </td>
                    <td className="py-2.5 px-3">
                      <span
                        className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono ${
                          row.status === "SLA OPTIMAL"
                            ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800"
                            : row.status === "AHT REVIEW"
                            ? "bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-800"
                            : "bg-rose-100 text-rose-800 dark:bg-rose-950/80 dark:text-rose-300 border border-rose-300 dark:border-rose-800"
                        }`}
                      >
                        {row.status}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Bottom Actions */}
          <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
            <button
              onClick={addSampleRow}
              className="btn-interactive px-4 py-2 rounded-lg text-xs font-semibold bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100"
            >
              + Add Batch Row
            </button>
            <button
              onClick={exportCsv}
              className="btn-interactive inline-flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow"
            >
              <Icon name="download" className="w-4 h-4" />
              Export Calculated CSV Report
            </button>
          </div>
        </div>
      );
    }

    // ========================================================================
    // INTERACTIVE SAMPLE 2: LLM HALLUCINATION & GROUNDING AUDITOR
    // ========================================================================
    function LlmAuditorSampleModal() {
      const scenarios = [
        {
          id: "sensor-sop",
          title: "Scenario 1: Environmental Sensor Calibration SOP Grounding",
          sourceText:
            "SOURCE DOCUMENT (ISO-SOP-402): The multiparameter water quality probe must be calibrated every 14 days using standard pH 4.01, 7.00, and 10.01 buffer solutions. Operating temperature range is -5°C to 50°C. Telemetry uploads occur every 15 minutes via cellular gateway.",
          prompt: "Summarize the calibration frequency, required pH buffers, and upload interval for the water quality probe.",

                        <p className="text-sm text-slate-600 dark:text-slate-400 mt-2">{exp.summary}</p>

                        {isOpen && (
                          <div className="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 space-y-3">
                            <ul className="space-y-2 text-xs sm:text-sm text-slate-700 dark:text-slate-300">
                              {exp.highlights.map((bullet, idx) => (
                                <li key={idx} className="flex items-start gap-2.5 leading-relaxed">
                                  <span className="text-blue-600 dark:text-blue-400 font-bold mt-0.5">▸</span>

                                </li>

                            <div className="flex flex-wrap gap-1.5 pt-2">

                                <span

                                  className="px-2.5 py-0.5 rounded text-[11px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400"
                                >
                                  {sk}
                                </span>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Academic Education Card */}
              <div className="mt-10 rounded-2xl bg-gradient-to-r from-slate-900 to-slate-800 dark:from-slate-900 dark:to-blue-950/40 text-white p-6 sm:p-8 border border-slate-800 shadow-lg">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-mono uppercase tracking-widest text-blue-400 font-semibold">
                      Academic Foundation • {data.education[0].programNote}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold mt-1">{data.education[0].degree}</h3>
                    <p className="text-sm text-slate-300 mt-1">
                      {data.education[0].institution} • <strong>{data.education[0].year}</strong>
                    </p>
                    <p className="text-xs sm:text-sm text-slate-400 mt-2 max-w-3xl">
                      {data.education[0].details}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ================================================================
              5. CERTIFICATES MODULE
          ================================================================ */}
          <section id="certificates" className="py-20 px-4 sm:px-6">
            <div className="max-w-6xl mx-auto">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
                <div>
                  <span className="text-xs font-mono uppercase tracking-widest text-blue-600 dark:text-blue-400 font-semibold">
                    Module 04 • Verified Credentials
                  </span>
                  <h2 className="text-2xl sm:text-4xl font-extrabold tracking-tight mt-1">
                    Certifications &amp; Standards Training
                  </h2>
                  <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400 mt-2">
                    Click any certification card to inspect the official certificate image and credential details.
                  </p>
                </div>

                {/* Certificate Category Filter */}
                <div className="flex flex-wrap gap-2">
                  {certCategories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setCertCategory(cat)}
                      className={`btn-interactive px-3.5 py-2 rounded-xl text-xs font-semibold transition ${
                        certCategory === cat
                          ? "bg-blue-600 text-white shadow-md shadow-blue-600/20"
                          : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800"
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredCerts.map(cert => (
                  <div
                    key={cert.id}
                    onClick={() => setActiveCertModal(cert)}
                    className="group cursor-pointer rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-500 p-6 shadow-sm hover:shadow-xl transition flex flex-col justify-between"

                    <div>
                      {cert.imageUrl ? (
                        <div className="mb-4 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 h-40 bg-slate-100 dark:bg-slate-950">
                          <img
                            src={cert.imageUrl}
                            alt={cert.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                          />
                        </div>
                      ) : (
                        <div className="flex items-center justify-between gap-2 mb-4">
                          <div className="p-2.5 rounded-xl bg-blue-600/10 text-blue-600 dark:text-blue-400">
                            <Icon name="award" className="w-5 h-5" />
                          </div>
                          <span className="px-2.5 py-1 rounded-full text-xs font-mono font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                            {cert.year}
                          </span>
                        </div>
                      )}

                      <div className="flex items-center justify-between gap-2">
                        <span className="text-[11px] font-mono uppercase tracking-wider text-blue-600 dark:text-blue-400 font-semibold">
                          {cert.category}
                        </span>
                        <span className="text-xs font-mono text-slate-400">{cert.year}</span>
                      </div>
                      <h3 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white mt-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">
                        {cert.title}
                      </h3>
                      <p className="text-xs font-semibold text-slate-500 mt-1">{cert.issuer}</p>
                      <p className="text-xs text-slate-600 dark:text-slate-400 mt-3 line-clamp-3 leading-relaxed">
                        {cert.summary}
                      </p>
                    </div>

                    <div className="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs font-semibold text-blue-600 dark:text-blue-400">
                      <span>{cert.verificationNote}</span>
                      <span>Inspect →</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ================================================================
              6. CONTACT MODULE
          ================================================================ */}

            <div className="max-w-6xl mx-auto">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                {/* Left Contact Info & Interactive Buttons */}
                <div className="lg:col-span-5 space-y-6">
                  <div>
                    <span className="text-xs font-mono uppercase tracking-widest text-blue-600 dark:text-blue-400 font-semibold">
                      Module 05 • Direct Engagement
                    </span>
                    <h2 className="text-2xl sm:text-4xl font-extrabold tracking-tight mt-1">
                      Let’s Build &amp; Automate Together
                    </h2>
                    <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400 mt-2 leading-relaxed">
                      Available immediately for full-time remote roles, project-based AI data evaluation, spreadsheet automation builds, and custom AI-assisted tools.
                    </p>
                  </div>

                  {/* Interactive Copy Cards */}
                  <div className="space-y-3">
                    <div className="p-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="p-2.5 rounded-lg bg-blue-600/10 text-blue-600 dark:text-blue-400">
                          <Icon name="mail" className="w-5 h-5" />
                        </div>
                        <div>
                          <p className="text-xs text-slate-500">Direct Email</p>
                          <p className="text-sm font-mono font-semibold">{data.profile.email}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => copyToClipboard(data.profile.email, "contact-email")}
                        className="btn-interactive px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-blue-600 hover:text-white transition"
                      >
                        {copiedField === "contact-email" ? "✓ Copied" : "Copy"}
                      </button>
                    </div>

                    <div className="p-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="p-2.5 rounded-lg bg-emerald-600/10 text-emerald-600 dark:text-emerald-400">
                          <Icon name="phone" className="w-5 h-5" />
                        </div>
                        <div>
                          <p className="text-xs text-slate-500">Phone / WhatsApp / Viber</p>
                          <p className="text-sm font-mono font-semibold">{data.profile.phone}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => copyToClipboard(data.profile.phone, "contact-phone")}
                        className="btn-interactive px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-emerald-600 hover:text-white transition"
                      >
                        {copiedField === "contact-phone" ? "✓ Copied" : "Copy"}
                      </button>
                    </div>
                  </div>

                  {/* External Profile & Resume Links */}

                    <p className="text-xs font-mono uppercase tracking-wider text-slate-400">
                      Profiles &amp; Resume Documents
                    </p>
                    <div className="flex flex-wrap gap-2.5">
                      <a
                        href={data.profile.socials.github}
                        target="_blank"
                        rel="noreferrer"
                        className="btn-interactive inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-900 text-white dark:bg-slate-800"
                      >
                        <Icon name="github" className="w-4 h-4" />
                        <span>GitHub (@CaptLeviticus)</span>
                      </a>

                      {data.profile.socials.linkedin && (
                        <a
                          href={data.profile.socials.linkedin}
                          target="_blank"
                          rel="noreferrer"
                          className="btn-interactive inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold bg-blue-700 text-white"
                        >
                          <span>LinkedIn Profile</span>
                          <Icon name="external" className="w-3.5 h-3.5" />
                        </a>
                      )}

                      {data.profile.socials.upwork && (
                        <a
                          href={data.profile.socials.upwork}
                          target="_blank"
                          rel="noreferrer"
                          className="btn-interactive inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold bg-emerald-700 text-white"
                        >
                          <span>Upwork Profile</span>
                          <Icon name="external" className="w-3.5 h-3.5" />
                        </a>
                      )}

                      {data.profile.socials.onlinejobs && (
                        <a

                          <span>OnlineJobs.ph</span>
                          <Icon name="external" className="w-3.5 h-3.5" />
                        </a>
                      )}

                      <a
                        href={data.profile.resumeHtmlUrl}
                        className="btn-interactive inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold bg-blue-600 text-white"
                      >
                        <Icon name="download" className="w-4 h-4" />
                        <span>Open Printable Resume</span>
                      </a>
                    </div>
                  </div>
                </div>

                {/* Right Interactive Inquiry Form */}
                <div className="lg:col-span-7">
                  <form
                    onSubmit={handleContactSubmit}
                    className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-lg space-y-5"
                  >
                    <h3 className="text-lg font-bold">Send a Direct Inquiry</h3>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                          Your Name *
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="e.g., Sarah Jenkins"
                          value={contactForm.name}
                          onChange={e => setContactForm({ ...contactForm, name: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm focus:outline-none focus:border-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                          Your Email *
                        </label>
                        <input
                          type="email"
                          required
                          placeholder="name@company.com"
                          value={contactForm.email}
                          onChange={e => setContactForm({ ...contactForm, email: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm focus:outline-none focus:border-blue-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                        Module / Service of Interest
                      </label>
                      <select
                        value={contactForm.service}
                        onChange={e => setContactForm({ ...contactForm, service: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm focus:outline-none focus:border-blue-500"
                      >
                        {data.services.map(s => (
                          <option key={s.id} value={s.title}>
                            {s.title}
                          </option>
                        ))}
                        <option value="Full-Time / Project-Based Role Opportunity">
                          Full-Time / Project-Based Role Opportunity
                        </option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                        Project Details or Role Description *
                      </label>
                      <textarea
                        rows="4"
                        required
                        placeholder="Share a brief overview of your team's dataset, spreadsheet workflow, or automation goals..."
                        value={contactForm.message}
                        onChange={e => setContactForm({ ...contactForm, message: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-4 pt-1">
                      <button
                        type="submit"
                        className="btn-interactive inline-flex items-center gap-2 px-6 py-3 rounded-xl text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/25"
                      >
                        <Icon name="mail" className="w-4 h-4" />
                        <span>Send Message to Levie</span>
                      </button>

                      {formStatus === "sent" && (
                        <span className="text-xs font-semibold text-emerald-600 dark:text-emerald-400">
                          ✓ Message delivered! Levie will respond shortly.
                        </span>
                      )}
                      {formStatus === "mailto-opened" && (
                        <span className="text-xs font-semibold text-blue-600 dark:text-blue-400">
                          ✓ Pre-filled email draft opened in your mail client!
                        </span>
                      )}
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>

          {/* ================================================================
              FOOTER
          ================================================================ */}

            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <p>
                © {new Date().getFullYear()} <strong>{data.profile.name}</strong> (@{data.profile.username}). All rights reserved.
              </p>
              <div className="flex items-center gap-4">
                <a href="#home" className="hover:text-blue-600">Top ↑</a>
                <a href={data.profile.resumeHtmlUrl} className="hover:text-blue-600">Printable Resume</a>
                <a href={data.profile.socials.github} target="_blank" rel="noreferrer" className="hover:text-blue-600">
                  GitHub Pages
                </a>
              </div>
            </div>
          </footer>

          {/* ================================================================
              MODAL 1: INTERACTIVE PORTFOLIO WORKBENCH MODAL
          ================================================================ */}
          {activeSampleProject && (
            <div
              className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
              onClick={() => setActiveSampleProject(null)}
            >
              <div
                className="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-4xl w-full p-5 sm:p-7 shadow-2xl my-auto max-h-[92vh] overflow-y-auto"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-start justify-between gap-4 pb-4 mb-5 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="px-2.5 py-0.5 rounded text-xs font-mono font-semibold bg-blue-600/10 text-blue-600 dark:text-blue-400">
                      LIVE INTERACTIVE WORKBENCH • {activeSampleProject.category}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold mt-1">{activeSampleProject.title}</h3>
                  </div>
                  <button
                    onClick={() => setActiveSampleProject(null)}
                    className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-rose-500 hover:text-white transition"
                    aria-label="Close modal"
                  >
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                {activeSampleProject.sampleType === "spreadsheet" && <SpreadsheetSampleModal />}
                {activeSampleProject.sampleType === "ai-auditor" && <LlmAuditorSampleModal />}
                {activeSampleProject.sampleType === "sensor-parser" && <SensorParserSampleModal />}
                {activeSampleProject.sampleType === "video-segmentation" && <VideoTaxonomySampleModal />}
              </div>
            </div>
          )}

          {/* ================================================================
              MODAL 2: CERTIFICATE LIGHTBOX MODAL
          ================================================================ */}
          {activeCertModal && (
            <div
              className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"
              onClick={() => setActiveCertModal(null)}
            >
              <div
                className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-2xl w-full p-6 sm:p-7 shadow-2xl space-y-5 my-auto max-h-[92vh] overflow-y-auto"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-start justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="p-3 rounded-xl bg-blue-600/10 text-blue-600 dark:text-blue-400">
                      <Icon name="award" className="w-6 h-6" />
                    </div>
                    <div>
                      <span className="text-xs font-mono uppercase text-blue-600 dark:text-blue-400 font-semibold">
                        {activeCertModal.credentialType} • {activeCertModal.year}
                      </span>
                      <h3 className="text-lg font-bold">{activeCertModal.title}</h3>
                    </div>
                  </div>
                  <button
                    onClick={() => setActiveCertModal(null)}
                    className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800"
                  >
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>

                {activeCertModal.imageUrl && (
                  <div className="rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-950">
                    <img
                      src={activeCertModal.imageUrl}
                      alt={activeCertModal.title}
                      className="w-full max-h-96 object-contain mx-auto"
                    />
                  </div>
                )}

                <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-2 text-xs sm:text-sm">
                  <p>
                    <strong>Issuing Organization:</strong> {activeCertModal.issuer}
                  </p>
                  <p>
                    <strong>Domain Category:</strong> {activeCertModal.category}
                  </p>
                  <p className="text-slate-600 dark:text-slate-400 pt-1">{activeCertModal.summary}</p>
                </div>

                <div>
                  <p className="text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">
                    Competencies &amp; Standards Covered:
                  </p>
                  <div className="flex flex-wrap gap-2">
                    {activeCertModal.skillsCovered.map(sk => (
                      <span
                        key={sk}
                        className="px-3 py-1 rounded-lg text-xs font-semibold bg-blue-600/10 text-blue-700 dark:text-blue-300"
                      >
                        ✓ {sk}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <span className="text-xs font-mono text-emerald-600 dark:text-emerald-400 font-semibold">
                    ● {activeCertModal.verificationNote}
                  </span>
                  <div className="flex items-center gap-2">
                    {activeCertModal.imageUrl && (
                      <a
                        href={activeCertModal.imageUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 hover:bg-blue-600 hover:text-white transition"
                      >
                        Open Full Image ↗
                      </a>
                    )}
                    <button
                      onClick={() => setActiveCertModal(null)}
                      className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-900 dark:bg-blue-600 text-white"
                    >
                      Close Preview
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
