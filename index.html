                        <p className="text-xs sm:text-sm text-slate-300 leading-relaxed mb-6">

                    <p className="text-slate-400 text-sm mt-2 max-w-xl">
                      Hands-on execution across remote AI annotation labs, priority-shadowed LLM quality evaluation, and field operations.

                        <p className="text-xs sm:text-sm text-slate-300 leading-relaxed mb-4">

                      </div>

                      <div className="pt-4 border-t border-white/10 flex flex-wrap gap-2">
                        {exp.skills.slice(0, 3).map((sk, skIdx) => (
                          <span key={skIdx} className="text-[10px] font-mono px-2 py-0.5 rounded bg-black/40 border border-white/5 text-slate-400">

                          </span>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* 6. SHOWCASE MODULE: CREDENTIALS (Summary Teaser) */}

                        <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mx-auto mb-3 group-hover:scale-110 transition">
