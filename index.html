      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);

      transform: translateY(-2px) scale(1.02);

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ========================================================================

    // ========================================================================
    // INTERACTIVE SAMPLE 1: SPREADSHEET AUTOMATION SIMULATOR
    // ========================================================================
    function SpreadsheetSampleModal() {
      const [targetAht, setTargetAht] = useState(65);
      const [minQaSla, setMinQaSla] = useState(96);
      const [rows, setRows] = useState([
        { id: "BATCH-101", modality: "Video Action Segmentation", tasks: 85, minutes: 82, errors: 1 },
        { id: "BATCH-102", modality: "LLM Grounding & Ranking", tasks: 64, minutes: 68, errors: 0 },
        { id: "BATCH-103", modality: "Taxonomy Metadata Tagging", tasks: 110, minutes: 95, errors: 2 },
        { id: "BATCH-104", modality: "Multimodal Audio/Text QA", tasks: 72, minutes: 84, errors: 4 }
      ]);
      const [activeFormula, setActiveFormula] = useState(
        '=ARRAYFORMULA(IF(C2:C5>0, ROUND((D2:D5*60)/C2:C5, 1), 0))'
      );

      const updateRow = (index, field, value) => {
        const num = Math.max(0, Number(value) || 0);
        setRows(prev => prev.map((r, i) => (i === index ? { ...r, [field]: num } : r)));
      };

      const addSampleRow = () => {
        const nextNum = 101 + rows.length;
        setRows(prev => [
          ...prev,
          {
            id: `BATCH-${nextNum}`,
            modality: "Peer QA Validation Audit",
            tasks: 90,
            minutes: 85,
            errors: 1
          }
        ]);
      };

      const computed = useMemo(() => {
        return rows.map(r => {
          const ahtSec = r.tasks > 0 ? Number(((r.minutes * 60) / r.tasks).toFixed(1)) : 0;
          const qaScore = r.tasks > 0 ? Number(Math.max(0, ((r.tasks - r.errors) / r.tasks) * 100).toFixed(1)) : 100;
          const ahtPass = ahtSec <= targetAht;
          const qaPass = qaScore >= minQaSla;
          const status = ahtPass && qaPass ? "SLA OPTIMAL" : qaPass ? "AHT REVIEW" : "QA AUDIT REQ";
          return { ...r, ahtSec, qaScore, ahtPass, qaPass, status };
        });
      }, [rows, targetAht, minQaSla]);

      const totals = useMemo(() => {
        const totalTasks = computed.reduce((s, r) => s + r.tasks, 0);
        const totalMin = computed.reduce((s, r) => s + r.minutes, 0);
        const totalErr = computed.reduce((s, r) => s + r.errors, 0);
        const avgAht = totalTasks > 0 ? ((totalMin * 60) / totalTasks).toFixed(1) : "0.0";
        const avgQa = totalTasks > 0 ? (((totalTasks - totalErr) / totalTasks) * 100).toFixed(1) : "100.0";
        const passCount = computed.filter(r => r.status === "SLA OPTIMAL").length;
        return { totalTasks, totalMin, avgAht, avgQa, passCount };
      }, [computed]);

      const exportCsv = () => {
        const headers = ["Batch ID,Modality,Tasks Completed,Duration (Min),Calculated AHT (Sec),QA Errors,QA Score (%),Automated SLA Status"];
        const csvRows = computed.map(
          r => `${r.id},"${r.modality}",${r.tasks},${r.minutes},${r.ahtSec},${r.errors},${r.qaScore}%,${r.status}`
        );
        const blob = new Blob([[...headers, ...csvRows].join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Automated_AHT_QA_Report_Levie_Lameyra.csv";
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="space-y-5">
          <div className="flex flex-wrap items-center gap-2 bg-[#090d16] border border-white/10 rounded-xl px-3.5 py-2.5 text-xs font-mono">
            <span className="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 font-bold">fx</span>
            <span className="text-emerald-400 break-all">{activeFormula}</span>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-[#0d121e]/80 p-4 rounded-xl border border-white/10">
            <div>
              <div className="flex justify-between text-xs font-semibold mb-1.5">
                <span className="text-slate-300">Target Max AHT Threshold (Seconds / Task)</span>
                <span className="font-mono text-emerald-400">{targetAht}s</span>
              </div>
              <input
                type="range"
                min="40"
                max="100"
                value={targetAht}
                onChange={e => setTargetAht(Number(e.target.value))}
                className="w-full accent-emerald-500 cursor-pointer"
              />
            </div>
            <div>
              <div className="flex justify-between text-xs font-semibold mb-1.5">
                <span className="text-slate-300">Minimum ISO QA Rubric Accuracy SLA (%)</span>
                <span className="font-mono text-emerald-400">{minQaSla}%</span>
              </div>
              <input
                type="range"
                min="90"
                max="100"
                step="0.5"
                value={minQaSla}
                onChange={e => setMinQaSla(Number(e.target.value))}
                className="w-full accent-emerald-500 cursor-pointer"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="p-3.5 rounded-xl bg-[#0d121e] border border-white/10">
              <p className="text-xs text-slate-400">Total Tasks Logged</p>
              <p className="text-xl font-bold font-mono mt-0.5">{totals.totalTasks}</p>
            </div>
            <div className="p-3.5 rounded-xl bg-[#0d121e] border border-white/10">
              <p className="text-xs text-slate-400">Weighted Avg AHT</p>
              <p className="text-xl font-bold font-mono text-emerald-400 mt-0.5">{totals.avgAht}s</p>
            </div>
            <div className="p-3.5 rounded-xl bg-[#0d121e] border border-white/10">
              <p className="text-xs text-slate-400">Net QA Accuracy</p>
              <p className="text-xl font-bold font-mono text-emerald-400 mt-0.5">{totals.avgQa}%</p>
            </div>
            <div className="p-3.5 rounded-xl bg-[#0d121e] border border-white/10">
              <p className="text-xs text-slate-400">Batches Meeting SLA</p>
              <p className="text-xl font-bold font-mono text-white mt-0.5">{totals.passCount} / {computed.length}</p>
            </div>
          </div>

          <div className="overflow-x-auto rounded-xl border border-white/10">
            <table className="w-full text-left border-collapse text-xs sm:text-sm">
              <thead>
                <tr className="bg-[#090d16] text-slate-300 border-b border-white/10 font-mono text-xs">
                  <th className="py-2.5 px-3">Batch ID</th>
                  <th className="py-2.5 px-3">Workflow Modality</th>
                  <th className="py-2.5 px-3">Tasks (Edit)</th>
                  <th className="py-2.5 px-3">Mins (Edit)</th>
                  <th className="py-2.5 px-3">Errors (Edit)</th>
                  <th className="py-2.5 px-3">Auto AHT</th>
                  <th className="py-2.5 px-3">QA Score</th>
                  <th className="py-2.5 px-3">SLA Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-white/10 bg-[#070a12]">
                {computed.map((row, idx) => (
                  <tr
                    key={row.id}
                    onClick={() =>
                      setActiveFormula(
                        `=IF(AND(F${idx + 2}<=${targetAht}, G${idx + 2}>=${minQaSla}%), "SLA OPTIMAL", IF(G${idx + 2}<${minQaSla}%, "QA AUDIT REQ", "AHT REVIEW"))`
                      )
                    }
                    className="hover:bg-white/5 transition cursor-pointer"
                  >
                    <td className="py-2.5 px-3 font-mono font-semibold text-xs text-emerald-400">{row.id}</td>
                    <td className="py-2.5 px-3 font-medium text-slate-200">{row.modality}</td>
                    <td className="py-2 px-3">
                      <input
                        type="number"
                        value={row.tasks}
                        onChange={e => updateRow(idx, "tasks", e.target.value)}
                        className="w-16 px-2 py-1 rounded border border-white/20 bg-[#0c101a] font-mono text-xs text-white"
                      />
                    </td>
                    <td className="py-2 px-3">
                      <input
                        type="number"
                        value={row.minutes}
                        onChange={e => updateRow(idx, "minutes", e.target.value)}
                        className="w-16 px-2 py-1 rounded border border-white/20 bg-[#0c101a] font-mono text-xs text-white"
                      />
                    </td>
                    <td className="py-2 px-3">
                      <input
                        type="number"
                        value={row.errors}
                        onChange={e => updateRow(idx, "errors", e.target.value)}
                        className="w-14 px-2 py-1 rounded border border-white/20 bg-[#0c101a] font-mono text-xs text-white"
                      />
                    </td>
                    <td className={`py-2.5 px-3 font-mono font-semibold ${row.ahtPass ? "text-slate-200" : "text-amber-400"}`}>
                      {row.ahtSec}s
                    </td>
                    <td className={`py-2.5 px-3 font-mono font-semibold ${row.qaPass ? "text-emerald-400" : "text-rose-400"}`}>
                      {row.qaScore}%
                    </td>
                    <td className="py-2.5 px-3">
                      <span
                        className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold font-mono ${
                          row.status === "SLA OPTIMAL"
                            ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
                            : row.status === "AHT REVIEW"
                            ? "bg-amber-500/20 text-amber-300 border border-amber-500/30"
                            : "bg-rose-500/20 text-rose-300 border border-rose-500/30"
                        }`}
                      >
                        {row.status}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
            <button
              onClick={addSampleRow}
              className="px-4 py-2 rounded-full text-xs font-semibold bg-white/10 hover:bg-white/20 text-white transition"
            >
              + Add Batch Row
            </button>
            <button
              onClick={exportCsv}
              className="btn-lumina inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-xs font-bold bg-emerald-400 hover:bg-emerald-300 text-slate-950 shadow"
            >
              <Icon name="download" className="w-3.5 h-3.5" />
              Export Calculated CSV Report
            </button>
          </div>
        </div>
      );
    }

    // ========================================================================
    // INTERACTIVE SAMPLE 2: LLM HALLUCINATION & GROUNDING AUDITOR
    // ========================================================================
    function LlmAuditorSampleModal() {
      const scenarios = [
        {
          id: "sensor-sop",
          title: "Scenario 1: Sensor Calibration SOP Grounding",

                      Let’s build <span className="font-editorial text-emerald-300 font-normal">together</span>
                    </h2>
                    <p className="text-sm text-slate-400 mt-2 leading-relaxed">
                      Available immediately for full-time remote roles, project-based data evaluation, spreadsheet automation builds, and custom AI tooling.
                    </p>
                  </div>

                  {/* Interactive Quick-Copy Cards */}
                  <div className="space-y-3">
                    <div className="p-4 rounded-2xl bg-[#0c101c] border border-white/10 flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                          <Icon name="mail" className="w-5 h-5" />
                        </div>
                        <div>
                          <p className="text-xs text-slate-400">Direct Email</p>
                          <p className="text-sm font-mono font-semibold text-white">{data.profile.email}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => copyToClipboard(data.profile.email, "contact-email")}
                        className="px-3.5 py-1.5 rounded-full text-xs font-bold bg-white/5 hover:bg-emerald-400 hover:text-slate-950 text-slate-200 border border-white/10 transition"
                      >
                        {copiedField === "contact-email" ? "✓ Copied" : "Copy"}
                      </button>
                    </div>

                    <div className="p-4 rounded-2xl bg-[#0c101c] border border-white/10 flex items-center justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                          <Icon name="phone" className="w-5 h-5" />
                        </div>
                        <div>
                          <p className="text-xs text-slate-400">Phone / WhatsApp / Viber</p>
                          <p className="text-sm font-mono font-semibold text-white">{data.profile.phone}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => copyToClipboard(data.profile.phone, "contact-phone")}
                        className="px-3.5 py-1.5 rounded-full text-xs font-bold bg-white/5 hover:bg-emerald-400 hover:text-slate-950 text-slate-200 border border-white/10 transition"
                      >
                        {copiedField === "contact-phone" ? "✓ Copied" : "Copy"}
                      </button>
                    </div>
                  </div>

                  {/* External Profiles Bar */}
                  <div className="pt-2 space-y-2">
                    <p className="text-[11px] font-mono uppercase tracking-wider text-slate-400">
                      Profiles &amp; Verification Links
                    </p>
                    <div className="flex flex-wrap gap-2">
                      <a
                        href={data.profile.socials.github}
                        target="_blank"
                        rel="noreferrer"
                        className="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold bg-white/5 hover:bg-white/10 text-white border border-white/10 transition"
                      >
                        <Icon name="github" className="w-3.5 h-3.5" />
                        <span>github.com/{data.profile.username}</span>
                      </a>

                      <a
                        href={data.profile.socials.linkedin}
                        target="_blank"
                        rel="noreferrer"
                        className="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/30 transition"
                      >
                        <Icon name="linkedin" className="w-3.5 h-3.5" />
                        <span>LinkedIn</span>
                      </a>

                      <a
                        href="./resume.html"
                        className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-semibold bg-white/5 hover:bg-white/10 text-white border border-white/10 transition"
                      >
                        <Icon name="download" className="w-3.5 h-3.5 text-emerald-400" />
                        <span>Executive CV</span>
                      </a>
                    </div>
                  </div>
                </div>

                {/* Inquiry Form */}
                <div className="lg:col-span-7">
                  <form
                    onSubmit={handleContactSubmit}
                    className="rounded-3xl bg-[#0c101c] border border-white/10 p-7 sm:p-8 shadow-2xl space-y-5"
                  >
                    <h3 className="text-xl font-bold text-white">Send a Project or Role Inquiry</h3>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1.5">
                          Your Name *
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Alex Morgan"
                          value={contactForm.name}
                          onChange={e => setContactForm({ ...contactForm, name: e.target.value })}
                          className="w-full px-4 py-3 rounded-2xl border border-white/10 bg-[#07090f] text-sm text-white focus:outline-none focus:border-emerald-400 transition"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1.5">
                          Your Email *
                        </label>
                        <input
                          type="email"
                          required
                          placeholder="alex@company.com"
                          value={contactForm.email}
                          onChange={e => setContactForm({ ...contactForm, email: e.target.value })}
                          className="w-full px-4 py-3 rounded-2xl border border-white/10 bg-[#07090f] text-sm text-white focus:outline-none focus:border-emerald-400 transition"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1.5">
                        Service of Interest
                      </label>
                      <select
                        value={contactForm.service}
                        onChange={e => setContactForm({ ...contactForm, service: e.target.value })}
                        className="w-full px-4 py-3 rounded-2xl border border-white/10 bg-[#07090f] text-sm text-white focus:outline-none focus:border-emerald-400 transition"
                      >
                        {data.services.map(s => (
                          <option key={s.id} value={s.title}>
                            {s.title}
                          </option>
                        ))}
                        <option value="Full-Time / Project-Based Role Opportunity">
                          Full-Time / Project-Based Role Opportunity
                        </option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1.5">
                        Project Overview or Job Details *
                      </label>
                      <textarea
                        rows="4"
                        required
                        placeholder="Describe your dataset, spreadsheet requirements, or automation project..."
                        value={contactForm.message}
                        onChange={e => setContactForm({ ...contactForm, message: e.target.value })}
                        className="w-full px-4 py-3 rounded-2xl border border-white/10 bg-[#07090f] text-sm text-white focus:outline-none focus:border-emerald-400 transition"
                      />
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-4 pt-1">
                      <button
                        type="submit"
                        className="btn-lumina inline-flex items-center gap-2 px-7 py-3 rounded-full text-sm font-extrabold bg-emerald-400 hover:bg-emerald-300 text-slate-950 shadow-xl shadow-emerald-500/25"
                      >
                        <Icon name="mail" className="w-4 h-4" />
                        <span>Send Message to Levie</span>
                      </button>

                      {formStatus === "sent" && (
                        <span className="text-xs font-semibold text-emerald-400">
                          ✓ Message delivered! Levie will reply shortly.
                        </span>
                      )}
                      {formStatus === "mailto-opened" && (
                        <span className="text-xs font-semibold text-emerald-400">
                          ✓ Pre-filled email draft opened in your mail client!
                        </span>
                      )}
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </section>

          {/* ================================================================
              FOOTER
          ================================================================ */}
          <footer className="py-10 px-4 sm:px-6 border-t border-white/10 text-xs text-slate-500">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <p>
                © {new Date().getFullYear()} <strong>{data.profile.name}</strong> (@{data.profile.username}). All rights reserved.
              </p>
              <div className="flex items-center gap-5">
                <a href="#home" className="hover:text-emerald-400 transition">Top ↑</a>
                <a href="./resume.html" className="hover:text-emerald-400 transition">Printable Resume</a>
                <a href={data.profile.socials.github} target="_blank" rel="noreferrer" className="hover:text-emerald-400 transition">
                  GitHub Pages
                </a>
              </div>
            </div>
          </footer>

          {/* ================================================================
              MODAL 1: INTERACTIVE WORKBENCH MODAL
          ================================================================ */}
          {activeSampleProject && (
            <div
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
              onClick={() => setActiveSampleProject(null)}
            >
              <div
                className="bg-[#0b0f19] border border-white/15 rounded-3xl max-w-4xl w-full p-6 sm:p-8 shadow-2xl my-auto max-h-[92vh] overflow-y-auto"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-start justify-between gap-4 pb-4 mb-5 border-b border-white/10">
                  <div>
                    <span className="px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      LIVE INTERACTIVE WORKBENCH • {activeSampleProject.category}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold mt-2 text-white">{activeSampleProject.title}</h3>
                  </div>
                  <button
                    onClick={() => setActiveSampleProject(null)}
                    className="p-2 rounded-full bg-white/10 hover:bg-rose-500 text-white transition"
                    aria-label="Close modal"
                  >
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                {activeSampleProject.sampleType === "spreadsheet" && <SpreadsheetSampleModal />}
                {activeSampleProject.sampleType === "ai-auditor" && <LlmAuditorSampleModal />}
                {activeSampleProject.sampleType === "sensor-parser" && <SensorParserSampleModal />}
                {activeSampleProject.sampleType === "video-segmentation" && <VideoTaxonomySampleModal />}
              </div>
            </div>
          )}

          {/* ================================================================
              MODAL 2: CERTIFICATE LIGHTBOX MODAL
          ================================================================ */}
          {activeCertModal && (
            <div
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 overflow-y-auto"
              onClick={() => setActiveCertModal(null)}
            >
              <div
                className="bg-[#0b0f19] border border-white/15 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl space-y-5 my-auto max-h-[92vh] overflow-y-auto"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-start justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="p-3 rounded-2xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      <Icon name="award" className="w-6 h-6" />
                    </div>
                    <div>
                      <span className="text-xs font-mono uppercase text-emerald-400 font-bold">
                        {activeCertModal.credentialType} • {activeCertModal.year}
                      </span>
                      <h3 className="text-lg font-bold text-white">{activeCertModal.title}</h3>
                    </div>
                  </div>
                  <button
                    onClick={() => setActiveCertModal(null)}
                    className="p-2 rounded-full bg-white/10 text-white"
                  >
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>

                {activeCertModal.imageUrl && (
                  <div className="rounded-2xl overflow-hidden border border-white/10 bg-black/50">
                    <img
                      src={activeCertModal.imageUrl}
                      alt={activeCertModal.title}
                      className="w-full max-h-96 object-contain mx-auto"
                    />
                  </div>
                )}

                <div className="p-4 rounded-2xl bg-black/40 border border-white/10 space-y-2 text-xs sm:text-sm">
                  <p>
                    <strong className="text-emerald-400">Issuing Organization:</strong> {activeCertModal.issuer}
                  </p>
                  <p>
                    <strong className="text-emerald-400">Domain Category:</strong> {activeCertModal.category}
                  </p>
                  <p className="text-slate-300 pt-1">{activeCertModal.summary}</p>
                </div>

                <div>
                  <p className="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-2">
                    Competencies &amp; Standards Covered:
                  </p>
                  <div className="flex flex-wrap gap-2">
                    {activeCertModal.skillsCovered.map(sk => (
                      <span
                        key={sk}
                        className="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-300 border border-emerald-500/20"
                      >
                        ✓ {sk}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="pt-3 border-t border-white/10 flex flex-wrap items-center justify-between gap-3">
                  <span className="text-xs font-mono text-emerald-400 font-bold">
                    ● {activeCertModal.verificationNote}
                  </span>
                  <div className="flex items-center gap-2">
                    {activeCertModal.imageUrl && (
                      <a
                        href={activeCertModal.imageUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="px-4 py-2 rounded-full text-xs font-semibold bg-white/10 text-white hover:bg-emerald-500 hover:text-slate-950 transition"
                      >
                        Open Full Image ↗
                      </a>
                    )}
                    <button
                      onClick={() => setActiveCertModal(null)}
                      className="px-5 py-2 rounded-full text-xs font-bold bg-emerald-400 text-slate-950"
                    >
                      Close Preview
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
