<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verified Credentials &amp; Certifications | Levie Andrew Cruz Lameyra</title>
  <meta
    name="description"
    content="Verified professional credentials of Levie Andrew Cruz Lameyra: Udemy AI for Virtual Assistants, HubSpot Social Media, IADALE Cybersecurity, ISO 9001/31000 Standards, ProVA SEO, and Solar PV."
  />
  <meta property="og:title" content="Verified Credentials — Levie Andrew Cruz Lameyra" />
  <meta property="og:description" content="Official certifications in AI, Cybersecurity, ISO Quality Standards, and Technical Systems." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://captleviticus.github.io/credentials.html" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600;1,6..72,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: {
              emerald: '#10b981',
              neon: '#34d399',
              dark: '#07090e',
              card: '#0d111a',
              border: 'rgba(255, 255, 255, 0.08)'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Portfolio Data -->
  <script src="./data.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .font-editorial { font-family: 'Newsreader', Georgia, serif; font-style: italic; }
    .agency-mesh {
      background-color: #06080e;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 15% 45%, rgba(16, 185, 129, 0.06) 0%, transparent 40%);
    }
    .agency-grid {
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .pill-navbar {
      background: rgba(10, 14, 22, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }
    .btn-lumina {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-lumina:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
    }
    .btn-ghost {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-ghost:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body class="bg-[#06080e] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const DATA = window.PORTFOLIO_DATA;

    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {
        bot: <path d="M12 2a2 2 0 0 1 2 2v2h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4V4a2 2 0 0 1 2-2zm-3 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-6 6h6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        'shield-check': <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        award: <g><circle cx="12" cy="8" r="6" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" stroke="currentColor" strokeWidth="2" fill="none"/></g>,
        'arrow-right': <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        'check': <path d="M20 6 9 17l-5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        search: <g><circle cx="11" cy="11" r="8" stroke="currentColor" strokeWidth="2" fill="none"/><path d="m21 21-4.3-4.3" stroke="currentColor" strokeWidth="2" fill="none"/></g>,
        menu: <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        x: <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        zoom: <g><path d="m21 21-4.3-4.3M11 8v6M8 11h6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/><circle cx="11" cy="11" r="8" stroke="currentColor" strokeWidth="2" fill="none"/></g>
      };
      return <svg className={className} viewBox="0 0 24 24">{icons[name] || icons.award}</svg>;
    }

    function Navbar({ active = "credentials" }) {
      const [mobileOpen, setMobileOpen] = useState(false);

      const navLinks = [
        { label: "Home", href: "index.html", key: "home" },
        { label: "What I Do", href: "services.html", key: "services" },
        { label: "Workbenches", href: "workbenches.html", key: "workbenches" },
        { label: "Experiences", href: "experiences.html", key: "experiences" },
        { label: "Credentials", href: "credentials.html", key: "credentials" },
        { label: "Contact", href: "contact.html", key: "contact" }
      ];

      return (
        <header className="fixed top-5 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
          <div className="pill-navbar rounded-full px-3 py-2 flex items-center justify-between gap-2 sm:gap-4 max-w-4xl w-full pointer-events-auto">
            <a href="index.html" className="flex items-center gap-2.5 pl-2 group">
              <img
                src={DATA.profile.avatarUrl}
                alt={DATA.profile.name}
                className="w-8 h-8 rounded-full object-cover ring-1 ring-white/20 group-hover:ring-emerald-400 transition"
              />
              <div className="flex flex-col">
                <span className="text-xs sm:text-sm font-semibold tracking-tight text-white group-hover:text-emerald-300 transition">
                  {DATA.profile.shortName}
                </span>
                <span className="text-[10px] text-slate-400 hidden sm:block">
                  {DATA.profile.username}
                </span>
              </div>
            </a>

            <nav className="hidden md:flex items-center gap-1 text-xs font-medium text-slate-300">
              {navLinks.map((link) => (
                <a
                  key={link.key}
                  href={link.href}
                  className={`px-3 py-1.5 rounded-full transition ${
                    active === link.key
                      ? "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 shadow-[0_0_12px_rgba(16,185,129,0.2)]"
                      : "hover:text-white hover:bg-white/5"
                  }`}
                >
                  {link.label}
                </a>
              ))}
            </nav>

            <div className="flex items-center gap-2">
              <a
                href="contact.html"
                className="btn-lumina hidden sm:inline-flex items-center gap-1.5 bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 text-xs font-semibold px-4 py-2 rounded-full shadow-lg shadow-emerald-500/20"
              >
                <span>Hire Me / Inquire</span>
                <Icon name="arrow-right" className="w-3.5 h-3.5" />
              </a>

              <button
                onClick={() => setMobileOpen(!mobileOpen)}
                className="md:hidden p-2 text-slate-300 hover:text-white hover:bg-white/5 rounded-full transition"
                aria-label="Toggle menu"
              >
                <Icon name={mobileOpen ? "x" : "menu"} className="w-5 h-5" />
              </button>
            </div>
          </div>

          {mobileOpen && (
            <div className="md:hidden fixed top-20 inset-x-4 bg-[#0a0f18]/95 backdrop-blur-xl border border-white/10 rounded-2xl p-4 shadow-2xl pointer-events-auto flex flex-col gap-2">
              {navLinks.map((link) => (
                <a
                  key={link.key}
                  href={link.href}
                  onClick={() => setMobileOpen(false)}
                  className={`px-4 py-2.5 rounded-xl text-sm font-medium transition ${
                    active === link.key
                      ? "bg-emerald-500/20 text-emerald-400 font-semibold"
                      : "text-slate-300 hover:bg-white/5 hover:text-white"
                  }`}
                >
                  {link.label}
                </a>
              ))}
              <a
                href="contact.html"
                className="btn-lumina mt-2 flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 font-semibold py-2.5 rounded-xl text-sm"
              >
                <span>Hire Me / Inquire</span>
                <Icon name="arrow-right" className="w-4 h-4" />
              </a>
            </div>
          )}
        </header>
      );
    }

    function CredentialsPage() {
      const certificates = DATA.certificates;
      const [filter, setFilter] = useState("all");
      const [lightboxCert, setLightboxCert] = useState(null);

      // Handle keyboard escape for lightbox
      useEffect(() => {
        function handleKeyDown(e) {
          if (e.key === "Escape") setLightboxCert(null);
        }
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      const categories = [
        { label: "All Credentials", key: "all" },
        { label: "AI & Automation", key: "AI & Automation" },
        { label: "Digital & Marketing", key: "Digital & Marketing" },
        { label: "Tech & Security", key: "Tech & Security" },
        { label: "Quality & Compliance", key: "Quality & Compliance" }
      ];

      const filteredCerts = filter === "all"
        ? certificates
        : certificates.filter(c => c.category === filter);

      return (
        <div className="min-h-screen agency-mesh agency-grid">
          <Navbar active="credentials" />

          <main className="pt-36 sm:pt-44 pb-24 px-4 sm:px-6 max-w-6xl mx-auto">
            {/* Header */}
            <div className="text-center max-w-3xl mx-auto mb-16">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium mb-6">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Verified Credentials &amp; Standards</span>
              </div>
              <h1 className="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-white mb-6 font-display">
                Industry <span className="font-editorial text-emerald-400">Certifications</span> &amp; Standards.
              </h1>
              <p className="text-base sm:text-lg text-slate-300 leading-relaxed">
                Formally certified across modern AI workflows, international ISO quality systems, cybersecurity fundamentals, and specialized technical operations. Click any certificate to open the high-resolution lightbox.
              </p>
            </div>

            {/* Category Filter Tabs */}
            <div className="flex flex-wrap items-center justify-center gap-2 mb-12">
              {categories.map((cat) => (
                <button
                  key={cat.key}
                  onClick={() => setFilter(cat.key)}
                  className={`px-4 py-2 rounded-full text-xs font-medium transition ${
                    filter === cat.key
                      ? "bg-emerald-500 text-slate-950 font-semibold shadow-lg shadow-emerald-500/20"
                      : "bg-white/5 border border-white/10 text-slate-300 hover:text-white hover:bg-white/10"
                  }`}
                >
                  {cat.label}
                </button>
              ))}
            </div>

            {/* Certificate Cards Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-20">
              {filteredCerts.map((cert) => (
                <div
                  key={cert.id}
                  className="bg-[#0b101b]/90 border border-white/10 rounded-3xl p-6 flex flex-col justify-between hover:border-emerald-500/40 transition group hover:shadow-[0_10px_30px_-10px_rgba(16,185,129,0.15)]"
                >
                  <div>
                    {/* Thumbnail Image / Preview */}
                    <div
                      onClick={() => cert.imageUrl && setLightboxCert(cert)}
                      className={`relative w-full h-44 rounded-2xl overflow-hidden mb-5 border border-white/10 bg-black/40 flex items-center justify-center ${
                        cert.imageUrl ? "cursor-pointer group-hover:border-emerald-500/40" : ""
                      }`}
                    >
                      {cert.imageUrl ? (
                        <>
                          <img
                            src={cert.imageUrl}
                            alt={cert.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                          />
                          <div className="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2 text-white text-xs font-semibold">
                            <Icon name="zoom" className="w-4 h-4 text-emerald-400" />
                            <span>Click to Zoom</span>
                          </div>
                        </>
                      ) : (
                        <div className="p-6 text-center">
                          <Icon name="shield-check" className="w-10 h-10 text-emerald-400 mx-auto mb-2" />
                          <span className="text-xs font-mono text-slate-400 block">{cert.issuer}</span>
                          <span className="text-[10px] text-emerald-400 font-mono">Formal Standard Training</span>
                        </div>
                      )}
                    </div>

                    <div className="flex items-center justify-between gap-2 mb-2">
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        {cert.category}
                      </span>
                      <span className="text-xs font-mono text-slate-400">{cert.year}</span>
                    </div>

                    <h3 className="text-base font-bold text-white mb-1 font-display group-hover:text-emerald-300 transition">
                      {cert.title}
                    </h3>
                    <div className="text-xs font-medium text-emerald-400/90 mb-3">
                      {cert.issuer} • {cert.credentialType}
                    </div>

                    <p className="text-xs text-slate-300 leading-relaxed mb-4">
                      {cert.summary}
                    </p>
                  </div>

                  <div>
                    <div className="pt-4 border-t border-white/10">
                      <h4 className="text-[10px] uppercase font-mono tracking-wider text-slate-400 mb-2">
                        Skills Verified
                      </h4>
                      <div className="flex flex-wrap gap-1.5 mb-4">
                        {cert.skillsCovered.map((s, sIdx) => (
                          <span
                            key={sIdx}
                            className="text-[10px] font-mono px-2 py-0.5 rounded bg-black/40 border border-white/5 text-slate-300"
                          >
                            {s}
                          </span>
                        ))}
                      </div>

                      {cert.imageUrl ? (
                        <button
                          onClick={() => setLightboxCert(cert)}
                          className="btn-ghost w-full py-2 px-3 rounded-xl text-xs font-semibold text-emerald-400 bg-white/5 border border-white/15 hover:bg-emerald-500 hover:text-slate-950 hover:border-emerald-500 transition flex items-center justify-center gap-1.5"
                        >
                          <Icon name="zoom" className="w-3.5 h-3.5" />
                          <span>View Full Certificate</span>
                        </button>
                      ) : (
                        <div className="text-center py-2 text-[11px] text-slate-400 font-mono">
                          {cert.verificationNote}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Lightbox Modal */}
            {lightboxCert && (
              <div
                className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md p-4 sm:p-8 flex items-center justify-center"
                onClick={() => setLightboxCert(null)}
              >
                <div
                  className="bg-[#0b101b] border border-white/15 rounded-3xl max-w-4xl w-full p-6 sm:p-8 relative shadow-2xl overflow-hidden"
                  onClick={(e) => e.stopPropagation()}
                >
                  <button
                    onClick={() => setLightboxCert(null)}
                    className="absolute top-4 right-4 p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition z-10"
                    aria-label="Close modal"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>

                  <div className="mb-4">
                    <span className="text-[10px] font-mono px-2.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      {lightboxCert.category} • {lightboxCert.year}
                    </span>
                    <h3 className="text-xl sm:text-2xl font-bold text-white mt-2 font-display">
                      {lightboxCert.title}
                    </h3>
                    <p className="text-xs text-slate-400">
                      Issued by <strong className="text-emerald-400">{lightboxCert.issuer}</strong> • {lightboxCert.verificationNote}
                    </p>
                  </div>

                  <div className="rounded-2xl overflow-hidden border border-white/10 bg-black/80 max-h-[60vh] flex items-center justify-center mb-4">
                    <img
                      src={lightboxCert.imageUrl}
                      alt={lightboxCert.title}
                      className="max-h-[60vh] w-auto object-contain"
                    />
                  </div>

                  <div className="flex items-center justify-between text-xs text-slate-400">
                    <span>Press <kbd className="px-1.5 py-0.5 bg-white/10 rounded font-mono text-[10px]">ESC</kbd> or click outside to dismiss.</span>
                    <a
                      href={lightboxCert.imageUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-1"
                    >
                      <span>Open image in new tab</span>
                      <Icon name="arrow-right" className="w-3.5 h-3.5" />
                    </a>
                  </div>
                </div>
              </div>
            )}

            {/* Bottom Callout */}
            <div className="text-center bg-[#0d121e] border border-white/10 rounded-3xl p-10 sm:p-14 relative overflow-hidden">
              <h2 className="text-3xl font-bold text-white mb-4 font-display">
                Need verification or have questions regarding standards?
              </h2>
              <p className="text-slate-300 text-sm max-w-lg mx-auto mb-8">
                I am happy to provide official credential IDs or walk through how ISO 9001 and AI ethics principles guide my daily delivery.
              </p>
              <div className="flex flex-wrap justify-center gap-4">
                <a
                  href="contact.html"
                  className="btn-lumina inline-flex items-center gap-2 bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 font-semibold px-6 py-3.5 rounded-full text-sm shadow-xl shadow-emerald-500/20"
                >
                  <span>Inquire / Contact Levie</span>
                  <Icon name="arrow-right" className="w-4 h-4" />
                </a>
                <a
                  href="workbenches.html"
                  className="btn-ghost inline-flex items-center gap-2 bg-white/5 border border-white/15 text-white font-medium px-6 py-3.5 rounded-full text-sm hover:bg-white/10"
                >
                  <span>Explore Workbenches</span>
                </a>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="border-t border-white/10 py-12 px-4 sm:px-6 bg-[#04060a]">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-slate-400">
              <div className="flex items-center gap-3">
                <img src={DATA.profile.avatarUrl} alt="" className="w-6 h-6 rounded-full object-cover" />
                <span>&copy; {new Date().getFullYear()} {DATA.profile.name}. All rights reserved.</span>
              </div>
              <div className="flex items-center gap-6">
                <a href="index.html" className="hover:text-emerald-400 transition">Home</a>
                <a href="services.html" className="hover:text-emerald-400 transition">Services</a>
                <a href="workbenches.html" className="hover:text-emerald-400 transition">Workbenches</a>
                <a href="experiences.html" className="hover:text-emerald-400 transition">Experiences</a>
                <a href="credentials.html" className="text-emerald-400 font-medium">Credentials</a>
                <a href="contact.html" className="hover:text-emerald-400 transition">Contact</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CredentialsPage />);
  </script>
</body>
</html>
