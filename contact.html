<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact &amp; Inquiries | Levie Andrew Cruz Lameyra</title>
  <meta
    name="description"
    content="Get in touch with Levie Andrew Cruz Lameyra for AI data annotation, custom spreadsheet automations, AI-assisted software development, or full-time remote roles."
  />
  <meta property="og:title" content="Contact & Inquiries — Levie Andrew Cruz Lameyra" />
  <meta property="og:description" content="Send a project inquiry, schedule a discussion, or connect on LinkedIn." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://captleviticus.github.io/contact.html" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600;1,6..72,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: {
              emerald: '#10b981',
              neon: '#34d399',
              dark: '#07090e',
              card: '#0d111a',
              border: 'rgba(255, 255, 255, 0.08)'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18 + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Portfolio Data -->
  <script src="./data.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .font-editorial { font-family: 'Newsreader', Georgia, serif; font-style: italic; }
    .agency-mesh {
      background-color: #06080e;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 15% 45%, rgba(16, 185, 129, 0.06) 0%, transparent 40%);
    }
    .agency-grid {
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .pill-navbar {
      background: rgba(10, 14, 22, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }
    .btn-lumina {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-lumina:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
    }
    .btn-ghost {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-ghost:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body class="bg-[#06080e] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const DATA = window.PORTFOLIO_DATA;

    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {
        bot: <path d="M12 2a2 2 0 0 1 2 2v2h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4V4a2 2 0 0 1 2-2zm-3 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-6 6h6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        mail: <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4 8 5 8-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        'map-pin': <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/><circle cx="12" cy="10" r="3" stroke="currentColor" strokeWidth="2" fill="none"/>,
        linkedin: <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        github: <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        'arrow-right': <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        'check': <path d="M20 6 9 17l-5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        copy: <rect width="14" height="14" x="8" y="8" rx="2" ry="2" stroke="currentColor" strokeWidth="2" fill="none"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" stroke="currentColor" strokeWidth="2" fill="none"/>,
        send: <path d="m22 2-7 20-4-9-9-4zM22 2 11 13" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        menu: <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        x: <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        'file-text': <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
      };
      return <svg className={className} viewBox="0 0 24 24">{icons[name] || icons.mail}</svg>;
    }

    function Navbar({ active = "contact" }) {
      const [mobileOpen, setMobileOpen] = useState(false);

      const navLinks = [
        { label: "Home", href: "index.html", key: "home" },
        { label: "What I Do", href: "services.html", key: "services" },
        { label: "Workbenches", href: "workbenches.html", key: "workbenches" },
        { label: "Experiences", href: "experiences.html", key: "experiences" },
        { label: "Credentials", href: "credentials.html", key: "credentials" },
        { label: "Contact", href: "contact.html", key: "contact" }
      ];

      return (
        <header className="fixed top-5 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
          <div className="pill-navbar rounded-full px-3 py-2 flex items-center justify-between gap-2 sm:gap-4 max-w-4xl w-full pointer-events-auto">
            <a href="index.html" className="flex items-center gap-2.5 pl-2 group">
              <img
                src={DATA.profile.avatarUrl}
                alt={DATA.profile.name}
                className="w-8 h-8 rounded-full object-cover ring-1 ring-white/20 group-hover:ring-emerald-400 transition"
              />
              <div className="flex flex-col">
                <span className="text-xs sm:text-sm font-semibold tracking-tight text-white group-hover:text-emerald-300 transition">
                  {DATA.profile.shortName}
                </span>
                <span className="text-[10px] text-slate-400 hidden sm:block">
                  {DATA.profile.username}
                </span>
              </div>
            </a>

            <nav className="hidden md:flex items-center gap-1 text-xs font-medium text-slate-300">
              {navLinks.map((link) => (
                <a
                  key={link.key}
                  href={link.href}
                  className={`px-3 py-1.5 rounded-full transition ${
                    active === link.key
                      ? "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 shadow-[0_0_12px_rgba(16,185,129,0.2)]"
                      : "hover:text-white hover:bg-white/5"
                  }`}
                >
                  {link.label}
                </a>
              ))}
            </nav>

            <div className="flex items-center gap-2">
              <a
                href="contact.html"
                className="btn-lumina hidden sm:inline-flex items-center gap-1.5 bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 text-xs font-semibold px-4 py-2 rounded-full shadow-lg shadow-emerald-500/20"
              >
                <span>Hire Me / Inquire</span>
                <Icon name="arrow-right" className="w-3.5 h-3.5" />
              </a>

              <button
                onClick={() => setMobileOpen(!mobileOpen)}
                className="md:hidden p-2 text-slate-300 hover:text-white hover:bg-white/5 rounded-full transition"
                aria-label="Toggle menu"
              >
                <Icon name={mobileOpen ? "x" : "menu"} className="w-5 h-5" />
              </button>
            </div>
          </div>

          {mobileOpen && (
            <div className="md:hidden fixed top-20 inset-x-4 bg-[#0a0f18]/95 backdrop-blur-xl border border-white/10 rounded-2xl p-4 shadow-2xl pointer-events-auto flex flex-col gap-2">
              {navLinks.map((link) => (
                <a
                  key={link.key}
                  href={link.href}
                  onClick={() => setMobileOpen(false)}
                  className={`px-4 py-2.5 rounded-xl text-sm font-medium transition ${
                    active === link.key
                      ? "bg-emerald-500/20 text-emerald-400 font-semibold"
                      : "text-slate-300 hover:bg-white/5 hover:text-white"
                  }`}
                >
                  {link.label}
                </a>
              ))}
              <a
                href="contact.html"
                className="btn-lumina mt-2 flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 font-semibold py-2.5 rounded-xl text-sm"
              >
                <span>Hire Me / Inquire</span>
                <Icon name="arrow-right" className="w-4 h-4" />
              </a>
            </div>
          )}
        </header>
      );
    }

    function ContactPage() {
      const profile = DATA.profile;
      const [copied, setCopied] = useState(false);
      const [formStatus, setFormStatus] = useState("idle"); // idle | sending | success | error

      const [formData, setFormData] = useState({
        name: "",
        email: "",
        topic: "Spreadsheet & Dashboard Automation",
        message: ""
      });

      // Parse query string for prefilled service
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const serviceParam = params.get("service");
        if (serviceParam) {
          setFormData(prev => ({
            ...prev,
            topic: serviceParam,
            message: `Hi Levie, I would like to inquire about your "${serviceParam}" service.`
          }));
        }
      }, []);

      function handleCopyEmail() {
        navigator.clipboard.writeText(profile.email);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      }

      function handleMailto(e) {
        e.preventDefault();
        const subject = encodeURIComponent(`[Inquiry] ${formData.topic} — from ${formData.name || 'Potential Client'}`);
        const body = encodeURIComponent(
          `Hi Levie,\n\nName: ${formData.name}\nEmail: ${formData.email}\nTopic / Need: ${formData.topic}\n\nMessage:\n${formData.message}\n\nSent from your portfolio website.`
        );
        window.location.href = `mailto:${profile.email}?subject=${subject}&body=${body}`;
        setFormStatus("success");
      }

      return (
        <div className="min-h-screen agency-mesh agency-grid">
          <Navbar active="contact" />

          <main className="pt-36 sm:pt-44 pb-24 px-4 sm:px-6 max-w-6xl mx-auto">
            {/* Header */}
            <div className="text-center max-w-3xl mx-auto mb-16">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium mb-6">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Get In Touch &amp; Hire Me</span>
              </div>
              <h1 className="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-white mb-6 font-display">
                Let's Build Something <span className="font-editorial text-emerald-400">Exceptional</span> Together.
              </h1>
              <p className="text-base sm:text-lg text-slate-300 leading-relaxed">
                Whether you need a full-time remote AI annotator/evaluator, custom spreadsheet dashboards, or intelligent workflow automations, I am available immediately.
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-20">
              {/* Left Column: Direct Info Cards */}
              <div className="lg:col-span-5 space-y-6">
                {/* Availability Card */}
                <div className="bg-[#0b101b] border border-white/10 rounded-3xl p-6 sm:p-8">
                  <div className="flex items-center gap-3 mb-4">
                    <span className="relative flex h-3 w-3">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span className="text-xs font-semibold uppercase tracking-wider text-emerald-400 font-mono">
                      Current Status
                    </span>
                  </div>
                  <h3 className="text-xl font-bold text-white mb-2 font-display">
                    {profile.availability}
                  </h3>
                  <p className="text-xs text-slate-300 leading-relaxed mb-6">
                    Ready to deploy immediately for high-accuracy multimodal annotation, LLM grounding evaluation, or custom automation projects.
                  </p>

                  <div className="space-y-3 pt-4 border-t border-white/10 text-xs">
                    <div className="flex items-center justify-between text-slate-300">
                      <span className="text-slate-400">Timezone</span>
                      <span className="font-mono text-emerald-300 font-semibold">{profile.timezone}</span>
                    </div>
                    <div className="flex items-center justify-between text-slate-300">
                      <span className="text-slate-400">Location</span>
                      <span className="font-semibold text-slate-200">{profile.location}</span>
                    </div>
                    <div className="flex items-center justify-between text-slate-300">
                      <span className="text-slate-400">Response SLA</span>
                      <span className="font-semibold text-emerald-400">Within 24 Hours</span>
                    </div>
                  </div>
                </div>

                {/* Direct Channels */}
                <div className="bg-[#0b101b] border border-white/10 rounded-3xl p-6 sm:p-8 space-y-4">
                  <h3 className="text-xs font-mono uppercase tracking-wider text-slate-400 mb-2">
                    Direct Contact Channels
                  </h3>

                  {/* Email with copy */}
                  <div className="p-4 rounded-2xl bg-black/40 border border-white/5 flex items-center justify-between gap-3">
                    <div className="flex items-center gap-3 overflow-hidden">
                      <div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
                        <Icon name="mail" className="w-4 h-4" />
                      </div>
                      <div className="overflow-hidden">
                        <span className="text-[10px] text-slate-400 block">Primary Email</span>
                        <a href={`mailto:${profile.email}`} className="text-xs font-mono text-white hover:text-emerald-300 truncate block">
                          {profile.email}
                        </a>
                      </div>
                    </div>
                    <button
                      onClick={handleCopyEmail}
                      className="p-2 rounded-xl bg-white/5 hover:bg-emerald-500 hover:text-slate-950 text-slate-300 transition flex-shrink-0"
                      title="Copy email to clipboard"
                    >
                      <Icon name={copied ? "check" : "copy"} className="w-4 h-4" />
                    </button>
                  </div>

                  {/* Phone */}
                  <div className="p-4 rounded-2xl bg-black/40 border border-white/5 flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
                      <Icon name="phone" className="w-4 h-4" />
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400 block">Phone / Mobile</span>
                      <a href={`tel:${profile.phone}`} className="text-xs font-mono text-white hover:text-emerald-300">
                        {profile.phone}
                      </a>
                    </div>
                  </div>

                  {/* LinkedIn */}
                  <a
                    href={profile.socials.linkedin}
                    target="_blank"
                    rel="noreferrer"
                    className="p-4 rounded-2xl bg-black/40 border border-white/5 flex items-center justify-between text-slate-200 hover:border-emerald-500/40 hover:text-white transition group"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center flex-shrink-0">
                        <Icon name="linkedin" className="w-4 h-4" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Professional Profile</span>
                        <span className="text-xs font-semibold group-hover:text-emerald-300">LinkedIn: /in/levieandrewlameyra</span>
                      </div>
                    </div>
                    <Icon name="arrow-right" className="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition" />
                  </a>

                  {/* GitHub */}
                  <a
                    href={profile.socials.github}
                    target="_blank"
                    rel="noreferrer"
                    className="p-4 rounded-2xl bg-black/40 border border-white/5 flex items-center justify-between text-slate-200 hover:border-emerald-500/40 hover:text-white transition group"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center flex-shrink-0">
                        <Icon name="github" className="w-4 h-4" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Open Source Repositories</span>
                        <span className="text-xs font-semibold group-hover:text-emerald-300">GitHub: @CaptLeviticus</span>
                      </div>
                    </div>
                    <Icon name="arrow-right" className="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition" />
                  </a>
                </div>
              </div>

              {/* Right Column: Interactive Form */}
              <div className="lg:col-span-7 bg-[#0b101b] border border-white/10 rounded-3xl p-6 sm:p-10 flex flex-col justify-between">
                <div>
                  <h2 className="text-2xl font-bold text-white mb-2 font-display">
                    Send a Direct Message
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-300 mb-6">
                    Fill out the form below to immediately draft and dispatch your inquiry to my inbox:
                  </p>

                  {/* Topic Presets */}
                  <div className="mb-6">
                    <label className="text-xs font-semibold text-slate-300 block mb-2">
                      Select Project Type or Inquiry:
                    </label>
                    <div className="flex flex-wrap gap-2">
                      {[
                        "Spreadsheet & Dashboard Automation",
                        "AI Data Annotation & LLM QA",
                        "AI-Assisted Web Tool / Script",
                        "Full-Time Remote Role"
                      ].map((topic) => (
                        <button
                          key={topic}
                          type="button"
                          onClick={() => setFormData({ ...formData, topic })}
                          className={`text-xs px-3 py-1.5 rounded-full transition ${
                            formData.topic === topic
                              ? "bg-emerald-500 text-slate-950 font-semibold"
                              : "bg-white/5 border border-white/10 text-slate-300 hover:text-white hover:bg-white/10"
                          }`}
                        >
                          {topic}
                        </button>
                      ))}
                    </div>
                  </div>

                  <form onSubmit={handleMailto} className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs text-slate-300 block mb-1">Your Name</label>
                        <input
                          type="text"
                          required
                          value={formData.name}
                          onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                          placeholder="e.g. Sarah Jenkins"
                          className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-300 block mb-1">Your Email</label>
                        <input
                          type="email"
                          required
                          value={formData.email}
                          onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                          placeholder="sarah@company.com"
                          className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs text-slate-300 block mb-1">Selected Subject / Topic</label>
                      <input
                        type="text"
                        value={formData.topic}
                        onChange={(e) => setFormData({ ...formData, topic: e.target.value })}
                        className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-slate-300 block mb-1">Your Message / Requirements</label>
                      <textarea
                        rows="5"
                        required
                        value={formData.message}
                        onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                        placeholder="Tell me about your dataset volume, spreadsheet bottlenecks, or target timeline..."
                        className="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition resize-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="btn-lumina w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20"
                    >
                      <Icon name="send" className="w-4 h-4" />
                      <span>Send Inquiry (Opens Default Email Client)</span>
                    </button>
                  </form>
                </div>

                {formStatus === "success" && (
                  <div className="mt-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs flex items-center gap-2">
                    <Icon name="check" className="w-4 h-4 text-emerald-400" />
                    <span>Your email composer has been launched. Thank you for reaching out!</span>
                  </div>
                )}
              </div>
            </div>

            {/* Bottom Executive Resume Bar */}
            <div className="bg-[#0e1422] border border-white/10 rounded-3xl p-8 flex flex-col sm:flex-row items-center justify-between gap-6">
              <div>
                <h3 className="text-lg font-bold text-white font-display">Need my credentials or resume for HR review?</h3>
                <p className="text-xs text-slate-300 mt-1">Both print-friendly HTML and original PDF resumes are prepared.</p>
              </div>
              <div className="flex items-center gap-3 flex-shrink-0">
                <a
                  href="resume.html"
                  className="btn-ghost inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold bg-white/5 border border-white/15 text-slate-200"
                >
                  <Icon name="file-text" className="w-3.5 h-3.5" />
                  <span>View Print Resume</span>
                </a>
                <a
                  href="./Levie_Andrew_Lameyra_Resume.pdf"
                  download
                  className="btn-lumina inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold bg-emerald-500 text-slate-950"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>Download PDF</span>
                </a>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="border-t border-white/10 py-12 px-4 sm:px-6 bg-[#04060a]">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-slate-400">
              <div className="flex items-center gap-3">
                <img src={DATA.profile.avatarUrl} alt="" className="w-6 h-6 rounded-full object-cover" />
                <span>&copy; {new Date().getFullYear()} {DATA.profile.name}. All rights reserved.</span>
              </div>
              <div className="flex items-center gap-6">
                <a href="index.html" className="hover:text-emerald-400 transition">Home</a>
                <a href="services.html" className="hover:text-emerald-400 transition">Services</a>
                <a href="workbenches.html" className="hover:text-emerald-400 transition">Workbenches</a>
                <a href="experiences.html" className="hover:text-emerald-400 transition">Experiences</a>
                <a href="credentials.html" className="hover:text-emerald-400 transition">Credentials</a>
                <a href="contact.html" className="text-emerald-400 font-medium">Contact</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ContactPage />);
  </script>
</body>
</html>
